program = "ninja"
version = ">=1.11"
tasks = ["verify", "analyze", "coverage"]

[external_tools.python]
program = "python3"
version = ">=3.10"
tasks = ["bootstrap", "ci"]

[external_tools.git]
program = "git"
version = ">=2.30"
tasks = ["bootstrap", "ci"]

[external_tools.rustc]
program = "rustc"
version = ">=1.94"
tasks = ["bootstrap", "ci"]

[external_tools.cargo]
