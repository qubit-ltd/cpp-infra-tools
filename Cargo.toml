[package]
name = "qubit-cpp-infra-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Latest-main C++ infrastructure tools, bootstrap, cache and transactional updates"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
repository = "https://github.com/qubit-ltd/cpp-infra-tools"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh_CN.md", "rust-toolchain.toml"]
readme = "README.md"

[[bin]]
name = "cpp-infra-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
semver = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
